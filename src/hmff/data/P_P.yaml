# form factors for pseudoscalar meson -> pseudoscalar meson

## example:
# B->pi:                            # M1->M2
# LCSR-pole:                      # mandatory 
#    state: DONE | DEBUG | UNFINISHED   # default: DONE
#    ref: arXiv:hep-ph/0406232     # optional 
#    author: P. Ball and R. Zwicky # optional, format: A. BB, C. DD, E. FF and G. HH
#    citation key: Ball:2004ye     # optional, obtained from InspireHep
#    method: LCSR                  # optional, e.g. LCSR, QCDSR, Lattice, etc.
#    comment: This is a comment    # optional, can be used to describe the method or any other information
#    f+: 
#      parameterization: double pole 1
#      parameter: {a1: 0.744, a2: -0.486, m1: 5.32, m2: 6.382}
#      or parameter: {a1: 0.744, a2: -0.486, m1_sq: 40.73, m2: 5.32} , if one prefer to use m_sq instead of m
#      or parameter: {a1: 0.744, a2: -0.486, m1: 40.73, m2_sq: 5.32} , if one prefer to use m_sq instead of m
#      error: {a1: 0.01, a2: 0.01, m1: 0.01, m2: 0.01} , optional, can be used to provide uncertainties
#      covariance matrix: <covariance_matrix>          , optional, can be used to provide uncertainties
#      comment: from table 3, not checked              , optional, can be used to describe the parameterization or any other information
#    f0:
#      parameterization: one pole
#      parameter: {a: 0.258, m: 5.32}
#      comment: from table 3, not checked
#    fT:
#      parameterization: double pole 1
#      parameter: {a1: 1.387, a2: -1.134, m1: 5.32, m2: 5.676}
#      comment: from table 3, not checked
