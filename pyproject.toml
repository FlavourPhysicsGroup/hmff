[project]
name = "hmff"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "ipykernel>=7.0.0",
    "ipython>=9.13.0",
    "matplotlib>=3.10.9",
    "pdf2image>=1.17.0",
    "pytest>=9.0.3",
]

[tool.setuptools.package-data]
hmff = ["data/*.yaml"]