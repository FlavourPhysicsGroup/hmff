# form factors for pseudoscalar meson -> vector meson


B->rho:
  LQCD-2008:
    ref: arxiv:0812.2795
    author: J.M. Flynn, Y. Nakagawa, J. Nieves, H. Toki
    method: LQCD
    citation key: Flynn:2008zr

  LCSR-pole:
    combined: false
    groups:
      vector:
        form factors: [V, A0, A1, A2]
        tex: {V: "$V$", A0: "$A_0$", A1: "$A_1$", A2: "$A_2$"}
        figure_path: tests/figures/B-rho-LCSR-pole/vector.pdf
        ref_figure_path: tests/ref_figures/B-rho-LCSR-pole/vector.png
        title: "$B \\to \\rho$"
        qsq_min: 0
        qsq_max: 14
        qsq_steps: 200
        f_min: 0
        f_max: 1
      tensor:
        form factors: [T1, T2, T3]
        tex: {T1: "$T_1$", T2: "$T_2$", T3: "$T_3$"}
        figure_path: tests/figures/B-rho-LCSR-pole/tensor.pdf
        ref_figure_path: tests/ref_figures/B-rho-LCSR-pole/tensor.png
        title: "$B \\to \\rho$"
        qsq_min: 0
        qsq_max: 14
        qsq_steps: 200
        f_min: 0
        f_max: 1

