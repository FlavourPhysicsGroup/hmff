B->pi:                            
  LCSR-pole 2004:                      
    ref: arXiv:hep-ph/0406232
    author: P. Ball and R. Zwicky
    citation key: Ball:2004ye 
    method: LCSR     
    f+: 
      parameterization: double pole 1
      parameter: {a1: 0.744, a2: -0.486, m1: 5.32, m2_sq: 40.73}
      comment: from table 3, not checked
    f0:
      parameterization: one pole
      parameter: {a: 0.258, m_sq: 33.81 }
      comment: from table 3, not checked
    fT:
      parameterization: double pole 1
      parameter: {a1: 1.387, a2: -1.134, m1: 5.32, m2_sq: 32.22}
      comment: from table 3, not checked
  
  LQCD-z 2021:
    ref: arXiv:2111.09849
    author: Y.Aoki and others
    citation key: FlavourLatticeAveragingGroupFLAG:2021npn
    method: LQCD 
    comment: B->pi form factors
    f+:
      parameterization: BCL 1
